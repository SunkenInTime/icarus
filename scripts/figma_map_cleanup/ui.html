<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    font: 13px system-ui;
    margin: 20px;
    background: #202124;
    color: #eee;
  }
  pre {
    white-space: pre-wrap;
  }
  button {
    padding: 8px 16px;
  }
</style>
<p>Icarus map layer audit</p>
<pre id="status">Preparing...</pre>
<button id="run">Back up, clean, and verify all 79 assets</button>
<script>
  const status = document.getElementById("status");
  document.getElementById("run").onclick = (event) => {
    event.target.disabled = true;
    parent.postMessage({ pluginMessage: { type: "run" } }, "*");
  };
  window.onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "status") status.textContent = msg.text;
    if (msg.type === "read") {
      try {
        const response = await fetch(
          "http://localhost:47839/artifact/" + msg.name,
        );
        if (!response.ok) throw new Error(await response.text());
        const data = msg.binary
          ? Array.from(new Uint8Array(await response.arrayBuffer()))
          : await response.text();
        parent.postMessage(
          { pluginMessage: { type: "saved", id: msg.id, data } },
          "*",
        );
      } catch (error) {
        parent.postMessage(
          {
            pluginMessage: { type: "saved", id: msg.id, error: String(error) },
          },
          "*",
        );
      }
    }
    if (msg.type === "save") {
      try {
        const response = await fetch("http://localhost:47839/artifact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: msg.name, data: msg.data }),
        });
        if (!response.ok) throw new Error(await response.text());
        parent.postMessage(
          { pluginMessage: { type: "saved", id: msg.id } },
          "*",
        );
      } catch (error) {
        parent.postMessage(
          {
            pluginMessage: { type: "saved", id: msg.id, error: String(error) },
          },
          "*",
        );
      }
    }
  };
</script>
