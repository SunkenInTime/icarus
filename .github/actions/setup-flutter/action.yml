name: Set up Flutter
description: >-
  Install the Flutter SDK pinned in .fvmrc through FVM, reusing cached pub
  packages and SDKs, then fetch the app's dependencies. Expects FVM_HOME and
  PUB_CACHE in the job environment.

runs:
  using: composite
  steps:
    # Its problem matcher resolves against the calling action's folder and
    # fails inside a composite action, so it stays off.
    - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      with:
        problem-matcher: false

    - name: Cache Pub Packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Cache FVM SDK
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .fvm_cache
        key: ${{ runner.os }}-fvm-${{ hashFiles('.fvmrc') }}
        restore-keys: |
          ${{ runner.os }}-fvm-

    # pwsh runs on every runner OS, and calls fvm.bat on Windows correctly.
    - name: Add Pub Cache To PATH
      shell: pwsh
      run: Join-Path $env:PUB_CACHE "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install FVM
      shell: pwsh
      run: dart pub global activate fvm

    - name: Install Flutter SDK
      shell: pwsh
      run: fvm install

    - name: Get Dependencies
      shell: pwsh
      run: fvm flutter pub get
