name: Release Store

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump to apply before building.
        type: choice
        required: true
        default: none
        options:
          - none
          - patch
          - minor
          - major
      publish_to_store:
        description: Publish the staged package to Partner Center.
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Production

    steps:
      # Before checkout, so no code from another branch runs in a job that
      # holds the Partner Center secret. The preflight script checks too, but
      # a branch can edit its own copy of that script. -cne, because both
      # Actions expressions and PowerShell's -ne ignore case, and a branch
      # named MAIN would pass either.
      - name: Require Main Branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw "Store releases must be dispatched from main. This run is on $env:GITHUB_REF."
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Store Release Preflight
        shell: pwsh
        env:
          ICARUS_PRODUCTION_CONVEX_DEPLOYMENT_URL: ${{ vars.ICARUS_PRODUCTION_CONVEX_DEPLOYMENT_URL }}
          ICARUS_PRODUCTION_CONVEX_CLIENT_ID: ${{ vars.ICARUS_PRODUCTION_CONVEX_CLIENT_ID }}
        run: powershell -ExecutionPolicy Bypass -File scripts/assert_release_preflight.ps1 -ReleaseTarget store

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Add Pub Cache To PATH
        shell: pwsh
        run: |
          "$env:LOCALAPPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install FVM
        shell: pwsh
        run: dart pub global activate fvm

      - name: Install Flutter SDK
        shell: pwsh
        run: fvm install

      - name: Bump Version
        if: ${{ inputs.version_bump != 'none' }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/bump_version.ps1 -Bump ${{ inputs.version_bump }}

      # windows/CMakeLists.txt builds the replay decoder (native/replay) with
      # cargo, on the version in native/replay/rust-toolchain.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d # 1.96.1
        with:
          components: clippy, rustfmt

      - name: Build Store Package
        shell: pwsh
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          ICARUS_PRODUCTION_CONVEX_DEPLOYMENT_URL: ${{ vars.ICARUS_PRODUCTION_CONVEX_DEPLOYMENT_URL }}
          ICARUS_PRODUCTION_CONVEX_CLIENT_ID: ${{ vars.ICARUS_PRODUCTION_CONVEX_CLIENT_ID }}
        run: powershell -ExecutionPolicy Bypass -File scripts/build_store_release.ps1

      - name: Upload Store Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-package
          path: release/out/store/**
          if-no-files-found: error

      - name: Set Up Microsoft Store CLI
        if: ${{ inputs.publish_to_store }}
        uses: microsoft/setup-msstore-cli@3b2ec9136230357ce9abc02b9d056626fb248d3f # v1

      - name: Publish To Partner Center
        if: ${{ inputs.publish_to_store }}
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCT_ID)) {
            throw "Repository variable MSSTORE_PRODUCT_ID is not configured."
          }

          $packageInfo = Get-Content release/out/store/package-info.json -Raw | ConvertFrom-Json
          $packagePath = Join-Path $PWD "release/out/store/$($packageInfo.packageFile)"

          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          msstore publish $env:GITHUB_WORKSPACE -i $packagePath -id $env:PRODUCT_ID

      - name: Commit Version Changes
        if: ${{ github.ref_type == 'branch' }}
        shell: pwsh
        run: |
          $changes = git status --porcelain -- pubspec.yaml lib/const/settings.dart
          if ([string]::IsNullOrWhiteSpace(($changes | Out-String))) {
            Write-Host "No version changes to commit."
            exit 0
          }

          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/const/settings.dart
          git commit -m "chore(release): store $version"
          git push origin HEAD:${{ github.ref_name }}
