name: Deploy Web

# Publishes the Flutter web build to the Cloudflare Pages project `icarus-web`,
# served at https://beta.icarusstrats.com. Every push to icarus-cloud that
# touches the web build deploys; Actions > Deploy Web > Run workflow redeploys.
# Setup and secrets: docs/release_process.md, "Web beta deploy".

on:
  push:
    branches:
      - icarus-cloud
    paths:
      - lib/**
      - web/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - .fvmrc
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older deploy that is still running.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FVM_HOME: ${{ github.workspace }}/.fvm_cache
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Require icarus-cloud and Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Every run replaces the live beta, so a manual run from another
          # branch would ship unreviewed code to testers.
          if [[ "$GITHUB_REF" != "refs/heads/icarus-cloud" ]]; then
            echo "::error::Deploy Web only runs from icarus-cloud. This run is on $GITHUB_REF."
            exit 1
          fi
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add the $name repository secret. See docs/release_process.md, \"Web beta deploy\"."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      # Flutter setup mirrors the linux job in ci.yml: FVM installs the
      # version pinned in .fvmrc.
      - uses: dart-lang/setup-dart@v1

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache FVM SDK
        uses: actions/cache@v4
        with:
          path: .fvm_cache
          key: ${{ runner.os }}-fvm-${{ hashFiles('.fvmrc') }}
          restore-keys: |
            ${{ runner.os }}-fvm-

      - name: Add Pub Cache To PATH
        shell: bash
        run: echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"

      - name: Install FVM and Flutter SDK
        shell: bash
        run: |
          dart pub global activate fvm
          fvm install

      - name: Get Dependencies
        run: fvm flutter pub get

      # Keep this command identical to "Build Web Client" in ci.yml, so CI
      # proves the exact build that ships. The beta deliberately uses the
      # development Convex deployment (docs/release_process.md, "Cloud build
      # configuration").
      - name: Build Web Client
        run: fvm flutter build web --no-wasm-dry-run --no-tree-shake-icons --dart-define=ICARUS_CLOUD_ENVIRONMENT=development

      # --branch=main: Cloudflare Pages treats a deploy to the project's
      # production branch (main) as the production deployment, and the custom
      # domain beta.icarusstrats.com follows production. Any other branch name
      # would only create a preview URL. This Pages branch name is unrelated
      # to the git branch; the source is always icarus-cloud.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action v4 installs Wrangler 4 by default.
          command: pages deploy build/web --project-name=icarus-web --branch=main --commit-hash=${{ github.sha }}

      - name: Summarize Deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PAGES_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
        run: |
          {
            echo "### Web beta deployed"
            echo ""
            echo "- Live: https://beta.icarusstrats.com"
            echo "- This deployment: ${DEPLOYMENT_URL:-see the Deploy to Cloudflare Pages log}"
            echo "- Pages environment: ${PAGES_ENVIRONMENT:-unknown} (production means the custom domain now serves it)"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
