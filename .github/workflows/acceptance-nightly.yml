name: Nightly Acceptance On Linux

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: Runs at once
        required: false
  push:
    branches:
      - t3/nightly-acceptance
      - t3/nightly-acceptance-red

permissions:
  contents: read
  issues: write

env:
  FVM_HOME: ${{ github.workspace }}/.fvm_cache

concurrency:
  group: acceptance-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  part:
    name: part ${{ matrix.part }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb ffmpeg

      - uses: ./.github/actions/setup-flutter

      - name: Put The Pinned Flutter On PATH
        run: echo "$FVM_HOME/versions/$(jq -r .flutter .fvmrc)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: third_party/convex_flutter/rust -> ../../../build/linux/x64/release/plugins/convex_flutter/cargokit_build

      - name: Build The Driver
        run: dart tool/drive/linux.dart build

      - name: Write The Library Fixture
        run: |
          set -o pipefail
          ICARUS_ACCEPTANCE_LIBRARY_FIXTURE="$RUNNER_TEMP/library" \
            flutter test test/library_store/drive_fixtures_test.dart \
            --plain-name 'writes the library the acceptance set' 2>&1 | tail -5

      - name: Run This Part On Hive And On The Store
        env:
          PART: ${{ matrix.part }}
          WORKERS: ${{ inputs.workers || '2' }}
        run: |
          started=$(date +%s)
          set +e
          dart tool/drive/acceptance.dart --out "$RUNNER_TEMP/acceptance" \
            --library "$RUNNER_TEMP/library" --workers "$WORKERS" --shard "$PART/4"
          status=$?
          set -e
          echo "wall time: $(( ($(date +%s) - started) / 60 )) min $(( ($(date +%s) - started) % 60 )) s with $WORKERS workers"
          exit $status

      - name: Gather This Part's Verdicts And Failing Runs
        if: always()
        run: |
          out="$RUNNER_TEMP/acceptance"
          kept="$RUNNER_TEMP/kept"
          mkdir -p "$kept"
          cp "$out/verdicts.json" "$out/report.txt" "$out/results.txt" "$kept/" 2>/dev/null || true
          grep ' NOT CLEAN' "$out/results.txt" 2>/dev/null | while read -r name mode _; do
            mkdir -p "$kept/$mode/$name"
            cp "$out/$mode/$name.launcher.txt" "$kept/$mode/" 2>/dev/null || true
            find "$out/$mode/$name" -maxdepth 2 -type f \( -name '*.log' -o -name '*.txt' \) \
              -exec cp {} "$kept/$mode/$name/" \; 2>/dev/null || true
          done

      - name: Keep This Part
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-part-${{ matrix.part }}
          path: ${{ runner.temp }}/kept
          if-no-files-found: ignore

  whole:
    name: the whole set
    needs: part
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          problem-matcher: false

      - name: Fetch Every Part
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: acceptance-part-*
          path: ${{ runner.temp }}/parts

      - name: Combine The Parts
        run: |
          parts="$RUNNER_TEMP/parts"
          mkdir -p "$parts"
          folders=$(for k in 1 2 3 4; do printf '%s/acceptance-part-%s,' "$parts" "$k"; done)
          set +e
          dart tool/drive/acceptance.dart --combine "${folders%,}" | tee "$RUNNER_TEMP/whole.txt"
          status=${PIPESTATUS[0]}
          set -e
          { echo '```'; cat "$RUNNER_TEMP/whole.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Report On The Tracking Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: "869"
        run: |
          {
            echo "Nightly acceptance on Linux at ${GITHUB_SHA::9} failed ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Each part's failing runs, launcher output and logs are its \`acceptance-part-N\` artifact."
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/whole.txt" ]; then
              sed -n '/^set:/,/^left out:/p' "$RUNNER_TEMP/whole.txt" | grep -v '^left out:'
            else
              echo 'the parts were not combined: see the failing step in the run'
            fi
            echo '```'
          } > report.md
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file report.md
