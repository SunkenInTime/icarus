name: Queue Model Sweep

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      first_seed:
        description: First seed of the 2,000 to sweep (default tonight's window)
        required: false

permissions:
  contents: read
  issues: write

env:
  FVM_HOME: ${{ github.workspace }}/.fvm_cache

concurrency:
  group: model-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - name: Pick Tonight's Window
        id: window
        env:
          ASKED: ${{ inputs.first_seed }}
        run: |
          night=$(( $(date -u +%s) / 86400 % 50 ))
          echo "first=${ASKED:-$(( 201 + 2000 * night ))}" >> "$GITHUB_OUTPUT"

      - name: Sweep 2,000 Seeds
        working-directory: packages/icarus_library
        env:
          CLOUD_MODEL_FIRST_SEED: ${{ steps.window.outputs.first }}
          CLOUD_MODEL_SEEDS: "2000"
        run: |
          set -o pipefail
          fvm dart pub get
          fvm dart test test/cloud_model_test.dart --plain-name "a sweep of" \
            --reporter expanded 2>&1 | tee sweep.log

      - name: Report On #847
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ steps.window.outputs.first }}
        run: |
          {
            echo "Nightly sweep of seeds $FIRST to $(( FIRST + 1999 )) at ${GITHUB_SHA::9} failed ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            grep -E '^SWEEP|remove these' packages/icarus_library/sweep.log > failures.txt || true
            total=$(wc -l < failures.txt)
            echo '```'
            head -40 failures.txt
            echo '```'
            if [ "$total" -gt 40 ]; then
              echo "$(( total - 40 )) more lines are in the run's log."
            fi
          } > report.md
          gh issue comment 847 --repo "$GITHUB_REPOSITORY" --body-file report.md
