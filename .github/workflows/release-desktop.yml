name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump to apply before building.
        type: choice
        required: true
        default: patch
        options:
          - none
          - patch
          - minor
          - major
      channel:
        description: Desktop updater channel.
        type: choice
        required: true
        default: stable
        options:
          - stable
          - prerelease
      mandatory:
        description: Mark the desktop update as mandatory.
        type: boolean
        required: true
        default: false
      publish_pages:
        description: Deploy the staged desktop updater manifest and installer downloads to GitHub Pages.
        type: boolean
        required: true
        default: true
      release_title:
        description: Title used if a new metadata file is created.
        type: string
        required: false
        default: ""
      change_message:
        description: First change entry used if a new metadata file is created.
        type: string
        required: false
        default: "Replace this with the desktop release summary."

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Main Branch
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: pwsh
        run: throw "Signed desktop releases must be dispatched from main."

      - uses: dart-lang/setup-dart@v1

      - name: Add Pub Cache To PATH
        shell: pwsh
        run: |
          "$env:LOCALAPPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install FVM
        shell: pwsh
        run: dart pub global activate fvm

      - name: Install Flutter SDK
        shell: pwsh
        run: fvm install

      - name: Build Windows Release Binaries
        shell: pwsh
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/release_desktop.ps1 -Phase build -VersionBump "${{ inputs.version_bump }}" -Channel "${{ inputs.channel }}"

      - name: Sign In To Azure With OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows Release Binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\windows\x64\runner\Release
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Build Signed Updater Archive And Installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/release_desktop.ps1 -Phase package -Channel "${{ inputs.channel }}"

      - name: Sign Windows Installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\installer
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Authenticode Signatures
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem -Path "build/windows/x64/runner/Release" -Recurse -File -Include "*.exe", "*.dll"
          $installerFiles = Get-ChildItem -Path "build/installer" -File -Filter "*.exe"
          $signedFiles = @($releaseFiles) + @($installerFiles)

          if ($signedFiles.Count -eq 0) {
            throw "No Windows executables or libraries were found to verify."
          }

          $invalidFiles = @(
            $signedFiles | Where-Object {
              (Get-AuthenticodeSignature -FilePath $_.FullName).Status -ne "Valid"
            }
          )
          if ($invalidFiles.Count -gt 0) {
            throw "Invalid Authenticode signatures: $($invalidFiles.FullName -join ', ')"
          }

          Write-Host "Verified $($signedFiles.Count) signed Windows files."

      - name: Stage And Publish Desktop Release
        shell: pwsh
        env:
          CHANGE_MESSAGE: ${{ inputs.change_message }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $args = @(
            "-ExecutionPolicy", "Bypass",
            "-File", "scripts/release_desktop.ps1",
            "-Phase", "stage",
            "-Channel", "${{ inputs.channel }}",
            "-ChangeMessage", $env:CHANGE_MESSAGE
          )

          if ("${{ inputs.publish_pages }}" -eq "true") {
            $args += @("-PublishPages", "-PagesPublishMode", "git-branch")
          }

          if ("${{ inputs.mandatory }}" -eq "true") {
            $args += "-Mandatory"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TITLE)) {
            $args += @("-ReleaseTitle", $env:RELEASE_TITLE)
          }

          & powershell @args

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ inputs.channel }}
          path: |
            release/out/desktop/**
            dist/**
          if-no-files-found: error

      - name: Print Published Download URLs
        if: ${{ inputs.publish_pages }}
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+\d+\b'
          if ($null -eq $versionLine -or $versionLine.Matches.Count -eq 0) {
            throw "Could not parse version name from pubspec.yaml"
          }
          $versionName = $versionLine.Matches[0].Groups[1].Value.Trim()
          $channel = "${{ inputs.channel }}"
          Write-Host "Published channel: $channel"

          Write-Host "Latest installer:"
          Write-Host "https://sunkenintime.github.io/icarus/downloads/windows/$channel/icarus-setup-latest.exe"
          Write-Host "Versioned installer:"
          Write-Host "https://sunkenintime.github.io/icarus/downloads/windows/$channel/icarus-setup-$versionName.exe"
          Write-Host "Updater manifest:"
          Write-Host "https://sunkenintime.github.io/icarus/updates/windows/$channel/app-archive.json"

      - name: Commit Version And Metadata Changes
        if: ${{ github.ref_type == 'branch' }}
        shell: pwsh
        run: |
          $changes = git status --porcelain -- pubspec.yaml lib/const/settings.dart release/metadata
          if ([string]::IsNullOrWhiteSpace(($changes | Out-String))) {
            Write-Host "No version or metadata changes to commit."
            exit 0
          }

          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+\+\d+)\b'
          if ($null -eq $versionLine -or $versionLine.Matches.Count -eq 0) {
            throw "Could not parse full version from pubspec.yaml"
          }
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/const/settings.dart release/metadata
          git commit -m "chore(release): desktop $version"
          git push origin HEAD:${{ github.ref_name }}
