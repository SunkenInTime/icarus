name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR makes its older run pointless, so it is cancelled.
# Each push to main gets a full run of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FVM_HOME: ${{ github.workspace }}/.fvm_cache
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  native-replay:
    needs: changes
    if: needs.changes.outputs.replay == 'true'
    runs-on: ubuntu-latest
    # Cargo build scripts run here: no write token, none left in .git.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native/replay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version in native/replay/rust-toolchain.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d # 1.96.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/replay/target
          key: ${{ runner.os }}-cargo-replay-${{ hashFiles('native/replay/Cargo.lock', 'native/replay/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-replay-

      # oozextract is GPL-derived: it must never enter the build
      # (docs/adr/0006-replay-decoder.md).
      - name: Keep oozextract out
        run: |
          if grep -q oozextract Cargo.lock; then
            echo "::error::oozextract is in native/replay/Cargo.lock"
            exit 1
          fi

      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features dev-vectors -- -D warnings

      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features dev-vectors
          # Our patched vrf-transform (patches/), against its build vectors.
          cargo test --locked -p vrf-transform

  # Decides which lanes a run needs.
  #
  # Pushes run every lane but the desktop builds: the release runs the upgrade
  # and rollback test on its signed installer before publishing. Manual runs,
  # PRs that change CI itself, and PRs whose files can't be listed run
  # everything.
  #
  # Any other PR can name its lanes on a line of its description:
  #
  #   ci: test web
  #   ci: skip
  #   ci: all
  #
  # Lanes: analyze, test, web, replay, convex, presence, contract, bridge,
  # desktop, separated by spaces or commas, unquoted. "skip" runs none of
  # them. A word that is not a lane runs every lane. Lanes that guard production or the
  # library (convex, presence, contract, desktop) still run when the PR
  # changes their files, whatever the line says. Without the line, a PR runs
  # analyze, test and web plus the lanes its changed files reach. The line is
  # read when the run starts, so after editing it, rerun the run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      analyze: ${{ steps.lanes.outputs.analyze }}
      test: ${{ steps.lanes.outputs.test }}
      web: ${{ steps.lanes.outputs.web }}
      replay: ${{ steps.lanes.outputs.replay }}
      convex: ${{ steps.lanes.outputs.convex }}
      presence: ${{ steps.lanes.outputs.presence }}
      contract: ${{ steps.lanes.outputs.contract }}
      bridge: ${{ steps.lanes.outputs.bridge }}
      desktop: ${{ steps.lanes.outputs.desktop }}
    steps:
      - name: Pick lanes
        id: lanes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          full=false
          merged=false
          files=""
          named=""
          if [[ "$EVENT" == "push" ]]; then
            merged=true
          elif [[ "$EVENT" != "pull_request" ]]; then
            full=true
          elif ! files=$(gh pr diff "$PR" --repo "$REPO" --name-only); then
            echo "Could not list the PR's files; running every lane."
            full=true
          elif grep -qE '^\.github/' <<<"$files"; then
            full=true
          else
            # The description is fetched, not taken from the event, so a
            # rerun sees the current line.
            body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body | tr -d '\r')
            # Anyone who can open a PR writes this line, so it is only data:
            # split without quote or escape handling, and only words checked
            # against the lane list reach the log or the outputs. Printing it
            # raw would let it write runner commands into the log.
            line=$(grep -m1 -iE '^ci:' <<<"$body" || true)
            if [[ -n "$line" ]]; then
              value=$(tr 'A-Z,' 'a-z ' <<<"${line#*:}")
              read -ra words <<<"$value"
              named=" "
              unknown=0
              for word in "${words[@]}"; do
                case "$word" in
                  analyze|test|web|replay|convex|presence|contract|bridge|desktop|skip) named+="$word " ;;
                  all) named+="all "; full=true ;;
                  *) unknown=$((unknown + 1)) ;;
                esac
              done
              printf 'The description names:%s\n' "$named"
              if (( unknown > 0 )); then
                printf '::warning::The ci: line has %d word(s) that are not lanes; running every lane. Lanes: analyze test web replay convex presence contract bridge desktop skip all.\n' "$unknown"
                full=true
              fi
            fi
          fi

          # lane NAME FILES [guarded]
          # FILES is a regex over changed paths; empty means the lane runs on
          # every PR that doesn't name its lanes.
          lane() {
            local why=""
            if [[ "$full" == true ]]; then
              why="every lane runs"
            elif [[ "$merged" == true ]]; then
              if [[ "$1" != desktop ]]; then
                why="push"
              fi
            elif [[ -n "$named" ]]; then
              if [[ "$named" == *" $1 "* ]]; then
                why="named in the description"
              elif [[ "${3:-}" == guarded && -n "$2" ]] && grep -qE "$2" <<<"$files"; then
                why="guarded, and its files changed"
              fi
            elif [[ -z "$2" ]]; then
              why="always on"
            elif grep -qE "$2" <<<"$files"; then
              why="its files changed"
            fi
            if [[ -n "$why" ]]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "$1: runs ($why)"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "$1: skipped"
            fi
          }
          lane analyze ''
          lane test ''
          lane web ''
          lane replay '^native/replay/'
          # The contract scripts in tool/ run in this lane, against its preview.
          lane convex '^(convex/|package(-lock)?\.json$|tsconfig\.json$|vitest\.config|tool/(snapshot|audit)_convex_contract\.mjs$)' guarded
          lane presence '^presence/' guarded
          lane contract '^(convex/|tool/|lib/collab/)' guarded
          lane bridge '^third_party/'
          # The desktop builds and the upgrade/rollback test, for changes to
          # what a shipped build finds in its Hive store, the installer, the
          # release scripts, or the test itself. The release runs the same
          # test on every signed installer; this catches a break on its PR.
          lane desktop '^(installer/|scripts/|lib/migrations/|test/windows_online_beta_library_probe_test\.dart$)|\.g\.dart$' guarded

  analyze:
    needs: changes
    if: needs.changes.outputs.analyze == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check Convex Web Binding Against The Browser Bundle
        run: node tool/check_convex_web_binding.mjs

      - uses: ./.github/actions/setup-flutter

      - name: Analyze
        run: fvm flutter analyze --no-fatal-infos

      - name: Check Bundled Wall Heights
        run: fvm dart run tool/check_bundled_wall_heights.dart

  test:
    name: test (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - uses: ./.github/actions/setup-flutter

      - name: Run Tests
        run: fvm flutter test --total-shards 2 --shard-index ${{ matrix.shard }}

  # Same flags as "Build Web Client" in deploy-web.yml, which ships the beta
  # against the production Convex deployment instead of development.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - uses: ./.github/actions/setup-flutter

      - name: Build Web Client
        run: fvm flutter build web --no-wasm-dry-run --dart-define=ICARUS_CLOUD_ENVIRONMENT=development

      - name: Prepare Web Fonts
        run: fvm dart run tool/prepare_web_fonts.dart build/web

  convex:
    needs: changes
    if: needs.changes.outputs.convex == 'true'
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      # One preview name per run. Runs on main are not serialized, and a
      # cancelled PR run still cleans up, so a name shared by PR or branch let
      # one run deploy into, or delete, another run's preview. The job deletes
      # its preview when it finishes, so previews never count against the team
      # deployment quota after the run.
      CONVEX_PREVIEW_NAME: typed-wrapper-contract-${{ github.run_id }}

    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Require Convex preview deploy key
        shell: bash
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Add the CONVEX_PREVIEW_DEPLOY_KEY repository secret so CI can create an isolated contract deployment."
            exit 1
          fi

      - name: Install Convex dependencies
        run: npm ci

      - name: Check Convex Types
        run: npx tsc --noEmit

      - name: Run Convex Tests
        run: npm run test:convex

      # `--cmd` runs right after Convex claims the preview and before the push,
      # so the preview URL is recorded even when typecheck or the push fails.
      - name: Deploy isolated Convex contract
        run: >-
          npx convex deploy --preview-create "$CONVEX_PREVIEW_NAME" --typecheck enable
          --cmd-url-env-var-name CONVEX_PREVIEW_URL
          --cmd 'echo "CONVEX_PREVIEW_URL=$CONVEX_PREVIEW_URL" >> "$GITHUB_ENV"'

      # Convex keeps previews for days by default and counts them against the
      # team's deployment quota. Cap this one at an hour in case the delete
      # below never runs (runner lost, job killed).
      - name: Expire contract preview within an hour
        if: always() && env.CONVEX_PREVIEW_URL != ''
        shell: bash
        run: |
          name="${CONVEX_PREVIEW_URL#https://}"; name="${name%%.*}"
          expires_at=$(( ($(date +%s) + 3600) * 1000 ))
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"expiresAt\": $expires_at}" \
            "https://api.convex.dev/v1/deployments/$name"

      - name: Compare fresh scrubbed contract
        run: |
          npm run snapshot:convex-contract:check
          npm run audit:convex-contract
          git diff --exit-code -- convex/function_spec.json convex/error_codes.json convex/_generated

      # The preview only exists for this run's contract check. A preview deploy
      # key may delete preview deployments in its own project.
      - name: Delete contract preview
        if: always() && env.CONVEX_PREVIEW_URL != ''
        shell: bash
        run: |
          name="${CONVEX_PREVIEW_URL#https://}"; name="${name%%.*}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" \
            "https://api.convex.dev/v1/deployments/$name/delete"
          echo "Deleted Convex preview $name"

  presence-worker:
    needs: changes
    if: needs.changes.outputs.presence == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presence
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presence/package-lock.json

      - name: Install Presence Worker Dependencies
        run: npm ci

      - name: Typecheck Presence Worker
        run: npm run typecheck

      # Runs the Worker and its Durable Object in the real Workers runtime.
      - name: Test Presence Worker
        run: npm test

  # The generated Convex client and the gates around it.
  client-contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          # The contract gate records the merge base with origin/main.
          # Fetch all branch history so that ref exists on PR and push runs.
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: Validate Convex Client Contract Gate
        working-directory: tool/convex_client_gauntlet
        run: |
          fvm dart pub get
          fvm dart test
          # Analyze this package only. The nested runtime fixtures are separate
          # Flutter packages, validated by the workload step below after their
          # own dependencies have been resolved.
          fvm dart analyze bin lib test

      - name: Validate Icarus Convex Generator
        working-directory: tool/icarus_convex_codegen
        run: |
          fvm dart pub get
          fvm dart analyze
          fvm dart test

      - name: Validate Protocol V3 Gauntlet Workload
        working-directory: tool/convex_client_gauntlet/runtime
        run: |
          fvm flutter pub get
          fvm dart analyze lib test tool
          fvm flutter test test/workload_test.dart

      - name: Reject Generated Client Drift
        run: |
          fvm dart run tool/icarus_convex_codegen/bin/generate.dart
          fvm dart run tool/icarus_convex_codegen/bin/generate.dart
          git diff --exit-code -- lib/collab/generated

  native-bridge:
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - name: Test Native Convex Bridge
        run: |
          cargo test --manifest-path third_party/convex_flutter/rust/Cargo.toml
          cargo test --manifest-path third_party/convex_rs/Cargo.toml

  linux-build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: ./.github/actions/setup-flutter

      # Cargokit builds the Rust bridge into the plugin's build folder. Its
      # compiled dependencies are cached; the bridge crate itself rebuilds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: third_party/convex_flutter/rust -> ../../../build/linux/x64/release/plugins/convex_flutter/cargokit_build

      - name: Build Linux Client
        run: fvm flutter build linux --no-tree-shake-icons --dart-define=ICARUS_CLOUD_ENVIRONMENT=development

  # Builds the Windows installer the way a release does and upgrades the last
  # public release to it, then rolls back.
  windows-build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - name: Test Release Safety Policy
        run: powershell -ExecutionPolicy Bypass -File scripts/test_release_safety.ps1

      - name: Validate PowerShell Scripts
        run: |
          $parseErrors = @(
            Get-ChildItem -Path scripts, installer -Filter "*.ps1" -File | ForEach-Object {
              $tokens = $null
              $parseFileErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseFileErrors
              )
              $parseFileErrors
            }
          )

          if ($parseErrors.Count -gt 0) {
            throw "PowerShell parse errors: $($parseErrors.Message -join ', ')"
          }

      - name: Test Release Signing Gates
        shell: powershell
        run: ./scripts/test_release_signing.ps1

      - uses: ./.github/actions/setup-flutter

      # Cargokit builds the Rust bridge into the plugin's build folder. Its
      # compiled dependencies are cached; the bridge crate itself rebuilds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: third_party/convex_flutter/rust -> ../../../build/windows/x64/plugins/convex_flutter/cargokit_build

      - name: Build Windows Client
        run: fvm flutter build windows --no-tree-shake-icons --dart-define=ICARUS_CLOUD_ENVIRONMENT=development

      - name: Build Windows Installer
        run: powershell -ExecutionPolicy Bypass -File installer/build_installer.ps1 -Configuration Release

      - name: Test Public Upgrade And Rollback
        run: |
          $installer = Get-ChildItem -Path build/installer -Filter 'icarus-setup-*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Release-candidate installer was not built."
          }
          powershell -ExecutionPolicy Bypass -File scripts/test_online_beta_windows_upgrade.ps1 `
            -ReleaseCandidateInstaller $installer.FullName

      - name: Upload Windows Release Candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icarus-windows-rc-${{ env.RELEASE_SOURCE_SHA }}
          path: |
            build/installer/icarus-setup-*.exe
            ${{ runner.temp }}/icarus-online-beta-windows-smoke/evidence.json
          if-no-files-found: error

  # The suite on the platform we ship, for the same changes as windows-build.
  windows-test:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Release Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - uses: ./.github/actions/setup-flutter

      - name: Run Tests
        run: fvm flutter test

      - name: Test Native Convex Bridge
        if: needs.changes.outputs.bridge == 'true'
        run: |
          cargo test --manifest-path third_party/convex_flutter/rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path third_party/convex_rs/Cargo.toml
