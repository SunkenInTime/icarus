name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    env:
      FVM_HOME: ${{ github.workspace }}/.fvm_cache
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - uses: actions/checkout@v4
        with:
          # The contract gate records the merge base with origin/icarus-cloud.
          # Fetch all branch history so that ref exists on PR and push runs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Convex Dependencies
        shell: pwsh
        run: npm ci

      - name: Check Convex Types
        shell: pwsh
        run: npx tsc --noEmit

      - name: Run Convex Tests
        shell: pwsh
        run: npm run test:convex

      - uses: dart-lang/setup-dart@v1

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache FVM SDK
        uses: actions/cache@v4
        with:
          path: .fvm_cache
          key: ${{ runner.os }}-fvm-${{ hashFiles('.fvmrc') }}
          restore-keys: |
            ${{ runner.os }}-fvm-

      - name: Add Pub Cache To PATH
        shell: pwsh
        run: |
          "$env:PUB_CACHE\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install FVM
        shell: pwsh
        run: dart pub global activate fvm

      - name: Install Flutter SDK
        shell: pwsh
        run: fvm install

      - name: Get Dependencies
        shell: pwsh
        run: fvm flutter pub get

      - name: Validate Convex Client Contract Gate
        shell: pwsh
        working-directory: tool/convex_client_gauntlet
        run: |
          fvm dart pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          fvm dart test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          fvm dart analyze

      - name: Analyze
        shell: pwsh
        run: fvm flutter analyze --no-fatal-infos
      - name: Build Web Client
        shell: pwsh
        run: fvm flutter build web --no-wasm-dry-run --no-tree-shake-icons
      - name: Run Tests
        shell: pwsh
        run: fvm flutter test
