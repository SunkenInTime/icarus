name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  native-replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/replay
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/replay/target
          key: ${{ runner.os }}-cargo-replay-${{ hashFiles('native/replay/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-replay-

      # oozextract is GPL-derived: it must never enter the build
      # (docs/adr/0006-replay-decoder.md).
      - name: Keep oozextract out
        run: |
          if grep -q oozextract Cargo.lock; then
            echo "::error::oozextract is in native/replay/Cargo.lock"
            exit 1
          fi

      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features dev-vectors -- -D warnings

      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features dev-vectors

  validate:
    runs-on: windows-latest
    env:
      FVM_HOME: ${{ github.workspace }}/.fvm_cache
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: .pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache FVM SDK
        uses: actions/cache@v4
        with:
          path: .fvm_cache
          key: ${{ runner.os }}-fvm-${{ hashFiles('.fvmrc') }}
          restore-keys: |
            ${{ runner.os }}-fvm-

      - name: Add Pub Cache To PATH
        shell: pwsh
        run: |
          "$env:PUB_CACHE\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install FVM
        shell: pwsh
        run: dart pub global activate fvm

      - name: Install Flutter SDK
        shell: pwsh
        run: fvm install

      - name: Get Dependencies
        shell: pwsh
        run: fvm flutter pub get

      - name: Analyze
        shell: pwsh
        run: fvm flutter analyze --no-fatal-infos

      - name: Validate PowerShell Scripts
        shell: pwsh
        run: |
          $parseErrors = @(
            Get-ChildItem -Path scripts, installer -Filter "*.ps1" -File | ForEach-Object {
              $tokens = $null
              $parseFileErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseFileErrors
              )
              $parseFileErrors
            }
          )

          if ($parseErrors.Count -gt 0) {
            throw "PowerShell parse errors: $($parseErrors.Message -join ', ')"
          }

      - name: Check Bundled Wall Heights
        shell: pwsh
        run: fvm dart run tool/check_bundled_wall_heights.dart
      - name: Test Release Signing Gates
        shell: powershell
        run: ./scripts/test_release_signing.ps1
      - name: Run Tests
        shell: pwsh
        run: fvm flutter test
