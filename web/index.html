<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Create, sync, and share Valorant strategies with Icarus.">
  <meta name="theme-color" content="#09090b">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Icarus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Flutter draws nothing until its fonts arrive; tool/prepare_web_fonts.dart
       replaces the next line with preloads so they download with main.dart.js. -->
  <!-- prepare_web_fonts preloads -->

  <title>Icarus</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; background: #09090b; }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: #09090b;
      transition: opacity 200ms ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #load-failed {
      display: none;
      text-align: center;
      font: 14px/20px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #a1a1aa;
    }
    #load-failed h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: #fafafa; }
    #load-failed button {
      margin-top: 16px;
      padding: 8px 16px;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      background: #27272a;
      color: #fafafa;
      font: 500 14px/20px system-ui, -apple-system, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    #loading.failed canvas { display: none; }
    #loading.failed #load-failed { display: block; }
  </style>
</head>
<body>
  <!--
    Shown until Flutter draws its first frame, which waits for main.dart.js,
    CanvasKit and the fonts to download. It draws the app's IcarusMarkLoader
    (lib/widgets/dot_matrix_loaders.dart) on a canvas, dot for dot where the
    splash lights the mark. If a script fails to download, it says so instead.
  -->
  <div id="loading" role="progressbar" aria-label="Loading Icarus">
    <canvas width="96" height="96" style="width: 96px; height: 96px"></canvas>
    <div id="load-failed" role="alert">
      <h1>Icarus couldn't load</h1>
      <div>Check your connection, then reload.</div>
      <button type="button" onclick="location.reload()">Reload</button>
    </div>
  </div>
  <script>
    (function () {
      var loading = document.getElementById('loading');
      var canvas = loading.querySelector('canvas');
      var ratio = window.devicePixelRatio || 1;
      canvas.width = canvas.height = Math.round(96 * ratio);
      var ctx = canvas.getContext('2d');
      if (ctx) ctx.scale(ratio, ratio);

      var size = 96, columns = 18, spacing = size / columns;
      var maxRadius = spacing * 0.46;
      var offDot = 'rgba(39, 39, 42, 0.45)';
      var deep = [76, 29, 149], violet = [124, 58, 237], white = [250, 250, 250];
      var mark = [
        '000000000000000000',
        '000000001000000000',
        '000000001100000000',
        '000000001110000000',
        '000000001110000000',
        '000000011110000000',
        '000000111110100000',
        '000001111110110000',
        '000011110101110000',
        '000111100001111000',
        '000111011001111000',
        '000111011100111000',
        '000110011110011000',
        '000000111100000000',
        '000001111011100000',
        '000000110011100000',
        '000000000000000000',
        '000000000000000000',
      ];

      function sq(x) { return x * x; }
      function clamp(x) { return Math.min(1, Math.max(0, x)); }
      function fract(x) { return x - Math.floor(x); }
      function hash(x, y) { return fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453); }
      function noise(x, y) {
        var xi = Math.floor(x), yi = Math.floor(y);
        var fx = x - xi, fy = y - yi;
        fx = fx * fx * (3 - 2 * fx);
        fy = fy * fy * (3 - 2 * fy);
        var top = hash(xi, yi) + (hash(xi + 1, yi) - hash(xi, yi)) * fx;
        var bottom = hash(xi, yi + 1) + (hash(xi + 1, yi + 1) - hash(xi, yi + 1)) * fx;
        return top + (bottom - top) * fy;
      }
      function fbm(x, y) { return 0.65 * noise(x, y) + 0.35 * noise(2 * x + 17, 2 * y + 13); }
      function mix(from, to, k) {
        return from.map(function (c, i) { return c + (to[i] - c) * k; });
      }

      // A port of _IcarusMarkPainter.sample on the splash's own lattice: [brightness, color] or null.
      function sample(col, row, u, v, t) {
        if (mark[row].charAt(col) !== '1') return null;
        var ember = fbm(u * 2.8, v * 2.4 + t * 1.2);
        var sweep = Math.exp(-sq(((u + v) / 2 - fract(t / 2.4) * 1.4 + 0.2) / 0.12));
        var intensity = clamp(0.45 + 0.45 * ember + 0.4 * sweep);
        return [
          intensity,
          intensity < 0.6
            ? mix(deep, violet, intensity / 0.6)
            : mix(violet, white, (intensity - 0.6) / 0.4),
        ];
      }

      function draw(t, lit) {
        if (!ctx) return;
        ctx.clearRect(0, 0, size, size);
        for (var row = 0; row < columns; row++) {
          for (var col = 0; col < columns; col++) {
            var cx = (col + 0.5) * spacing, cy = (row + 0.5) * spacing;
            var dot = sample(col, row, cx / size, cy / size, t);
            var glow = dot && dot[0] + (1 - dot[0]) * lit;
            ctx.fillStyle = dot ? 'rgb(' + mix(dot[1], white, lit).map(Math.round) + ')' : offDot;
            ctx.beginPath();
            ctx.arc(cx, cy, dot ? maxRadius * Math.sqrt(glow) : maxRadius * 0.22, 0, 2 * Math.PI);
            ctx.fill();
          }
        }
      }

      var start = performance.now(), frame = 0, litFrom = 0, lighting = 140;
      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (still) {
        draw(0.35, 0);
      } else {
        (function tick(now) {
          var lit = litFrom ? clamp((now - litFrom) / lighting) : 0;
          draw((now - start) / 1000, lit);
          if (lit >= 1) return loading.remove();
          frame = requestAnimationFrame(tick);
        })(start);
      }

      // A script that fails to download (flutter_bootstrap.js, main.dart.js,
      // CanvasKit) means the app will never start. Load errors don't bubble,
      // so listen in the capture phase.
      window.addEventListener('error', function (event) {
        if (!(event.target instanceof HTMLScriptElement)) return;
        cancelAnimationFrame(frame);
        loading.classList.add('failed');
        loading.removeAttribute('role');
      }, true);

      // shadcn_ui turns the browser's menu off only while a right-click lands on
      // something with its own menu, so a right-click on an open menu or the
      // empty map got Back, Refresh and Save as over the app. Only the app's
      // drawn surface goes: text fields and selectable text are real elements
      // on top of it, and they keep Cut, Copy and Paste.
      window.addEventListener('contextmenu', function (event) {
        var surface = event.composedPath()[0].tagName;
        if (surface === 'FLUTTER-VIEW' || surface === 'FLT-SEMANTICS') {
          event.preventDefault();
        }
      });

      var released = false, left = false;
      function leave() {
        if (left) return;
        left = true;
        loading.classList.add('done');
        setTimeout(function () {
          cancelAnimationFrame(frame);
          loading.remove();
        }, 200);
      }
      window.icarusSplashReady = function () {
        if (released) return;
        released = true;
        if (still || left) return loading.remove();
        litFrom = performance.now();
      };
      window.addEventListener('flutter-first-frame', function () {
        if (released || !window.icarusSplashPending) return leave();
        setTimeout(function () { if (!released) leave(); }, 3000);
      }, { once: true });
    })();
  </script>

  <!--
    Official Convex browser transport. Flutter's published Convex package still
    uses an obsolete web authentication wire shape; native builds continue to
    use that package's Rust transport.
  -->
  <script src="convex.browser.bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
